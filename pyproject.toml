# Tool configuration. This is not an installable package: receiver/ and sender/ are run directly
# (their modules import each other by flat name), so ruff and mypy run from the repo root / per directory.
[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["tests/fakebin"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "PERF", "C4", "PIE", "ISC", "BLE",
          "D", "ANN", "S110", "S112", "PLR2004", "PLR0912", "PLR0915", "C901", "N", "A", "E722"]
ignore = [
    "RUF001", "RUF002", "RUF003",   # typographic characters (×, –, „”) in UI strings and comments are intended
    "SIM105",                       # try/except/pass reads better than contextlib.suppress on hot paths
    "SIM108",                       # plain if/else instead of a forced conditional expression
    "E741",                         # short loop names (l, i) over pad data
    "RUF023",                       # __slots__ follow the field order, not alphabetical order
    "SIM112",                       # Windows environment variables (%SystemRoot%) are case-insensitive
    "SIM905",                       # a program-name list as text + .split() is easier to read than a long list
    "ANN401",                       # Any is the honest type for protocol payload tuples and decoded JSON
    "N812",                         # `import PySide6.QtCore as QtCore`-style aliases follow the Qt documentation
]

[tool.ruff.lint.per-file-ignores]
"receiver/*" = ["D", "ANN", "BLE001","RUF100", "S110", "S112", "PLR2004", "PLR0912", "PLR0915", "C901", "N", "A", "E722"]   # TODO(refactor): drop as the receiver is cleaned up
"tests/*" = ["D", "ANN", "BLE", "S", "PLR", "C901", "N", "A", "E401", "E501", "F401", "E402", "E701", "E702", "E731", "B011", "F403", "F405", "SIM", "PERF", "RUF", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # evdev, vgamepad, pythonnet, pycaw, PySide6 are optional or platform specific
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["^tests/", "^tools/"]

# Module-level state such as `states = None` is filled in by init() before any thread starts, so mypy sees an Optional it can
# never narrow, and many empty containers carry no element type. Until those globals get real types, these error kinds are
# off; everything else (arg-type, call-arg, attr-defined, return-value, ...) is enforced.
disable_error_code = ["var-annotated", "has-type", "assignment", "union-attr"]

# The window code is dynamic Qt (attributes like `self.sender` shadow QObject methods, signals connect by keyword), which the
# PySide6 stubs reject, so Qt is seen as untyped; our own code around it is still checked.
[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*", "shiboken6", "shiboken6.*"]
follow_imports = "skip"
