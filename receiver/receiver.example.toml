# Receiver (Windows). Copy it as receiver.toml, uncomment and change what you need.
# receiver.toml next to receiver_controller.py is loaded by itself; another file: python receiver_controller.py --config other.toml
# The values below are the defaults.

# in_port = 5005
# dsu_port = 26760
# dsu_bind = "127.0.0.1"   # the DSU server for this computer only; "0.0.0.0" = an emulator on another device in the network
#   (then anyone on the LAN sees the pads' movements and buttons, and a forged address turns the server into a traffic source)
# dsu_max_clients = 4   # the most DSU subscribers at a time
# hm_min_age_days = 7   # a new HIDMaestro version installs only this many days after its release (an unsigned release
#   ends up in the administrator process - swapped releases usually disappear within days); 0 = at once
# pads = 4   # the number of slots (max 4); virtual pads are created only for connected ones
# mouse_pads = [0]   # which controllers start in the mouse mode (with a master pad: the master has the mouse)
# pad_hz = 1000   # the highest DS4 report rate (merging bursts of packets, like the sender's pad_min_dt = 1 ms); 0 = no limit
# dsu_hz = 1000   # same for DSU; 0 = no limit
# dsu_tx_interval = 0.5   # do not send an unchanged DSU state more often than this
# dsu_batch = false   # several DSU packets in one datagram - not every client accepts that
# acc_res = 8192.0
# gyro_res = 1024.0
# acc_sign = [1, 1, 1]
# gyro_sign = [1, 1, 1]
# mouse_sens = 0.5   # the starting value 0.05-5 (too fast -> 0.35, too slow -> 0.8); afterwards Settings -> Mouse (settings.json)
# scroll_sens = 0.6   # two-finger scrolling (wheel units per touchpad unit); 120 = 1 notch
# scroll_natural = false   # True = the content follows the fingers (like on a phone)
# stale_s = 0.5   # silence longer than this -> reset the state (against "stuck buttons")
# unplug_s = 10.0   # silence longer than this -> unplug the virtual DS4
# allow = ""   # e.g. "192.168.1.50" - only packets from this IP
# key = ""   # a shared HMAC key (or the PADKEY environment variable) - the same in the sender. Without it anyone on the
#   LAN can control this computer through the receiver (mouse, master pad actions). Generate one:
#   python -c "import secrets; print(secrets.token_urlsafe(24))"
# stats = false   # print packet statistics every second
# log_file = ""   # e.g. "receiver.log" (useful with pythonw / autostart)
# remap_file = "remap.json"   # remap profiles (the Save button in the window)
# gui = true   # the window (pads, battery, remapping; --no-gui turns it off)
# tray = true   # minimise to the system tray
# gui_topmost = false   # the window always on top
# gui_start_visible = false   # True = show the window right after startup
# gui_wait_pad = false   # True = create neither the window nor the icon until a pad connects
# low_batt = 15   # the low battery threshold (%) - only the starting value; afterwards Settings -> Lightbar (settings.json)
# low_batt_notify = true   # a tray notification on low battery
# ps_modifier = true   # PS as a shortcut key: a short PS reaches the game on release (+~0.1 s), PS + a button = a shortcut
# ps_hold_s = 1.0   # holding PS this long (with no other button) = ps_hold_action
# ps_hold_action = "gamebar"   # gamebar (Win+G) | bigpicture (Steam Big Picture) | none
# ps_share_action = "screenshot"   # screenshot (Win+PrtScr, to Pictures\Screenshots) | capture (Game Bar) | none
# confirm = true   # confirmations on the pad: a short rumble / a lightbar flash for shortcuts
# idle_lightbar = [0, 0, 128]   # the default lightbar colour when the game does not set one (Settings -> Lightbar changes it per pad)
# game_profiles = true   # an automatic profile by the foreground game
# game_ignore = []   # extra programs left out of the "recent games" list in the editor (e.g. "obs64.exe")
