# Sender (a Raspberry Pi, a phone - any Linux device the pads connect to). Copy it as sender.toml, uncomment and change what you need.
# Run:  doas python3 sender_controller.py --config sender.toml
# The values below are the defaults.

# host = "192.168.1.4"
# port = 5005
# max_pads = 2
# slots_file = "slots.json"   # pad (MAC) -> a fixed slot across restarts (player 1 / 2 in a game); "" = not remembered
# wol_file = "wol.json"       # Wake-on-LAN and log events: the settings from the receiver window, saved on the sender
# gyro_cal_file = "gyro_cal.json"   # gyro calibration from the receiver window, per pad (MAC); "" = not saved
# bt_adapter = "auto"   # Bluetooth controller: auto (a USB dongle before the built-in one, the rest blocked with rfkill) | builtin |
#   manual (the sender changes nothing); a choice made in the window (Bluetooth panel: Use / Auto / Manual) is saved in bt_file
#   and takes precedence
# bt_file = "bt.json"
# auth_file = "auth.json"   # with a key: the remembered switch to protocol v3 (protection against replayed packets)
# remote_cfg_file = "remote_cfg.json"   # settings changed in the receiver window (Settings -> Sender): saved here and they win over this
#   file for the same key; needs the HMAC key (key) on both sides, a packet without it is refused. "" = no changes from the receiver.
#   Not changeable from the receiver: host, port, key, the *_file paths, bt_adapter, stats. Delete a line in remote_cfg.json (or press
#   "Back to the config file" in the window) to use the value from this file again
# grab_pad = true
# grab_touch = true
# tap_click = true
# tap_max_s = 0.2
# tap_max_move = 40
# heartbeat_s = 0.05
# pad_min_dt = 0.001   # minimum gap between state packets (1 ms = 1000 Hz; it was 4 ms - up to 3 ms of stick latency); the first one after silence
#   goes out at once, changes inside the window merge into one packet at the end of it; 0 = no limit
# motion_min_dt = 0.001   # same for motion; the gyro/acc samples inside a window are averaged
# motion_deadband_gyro = 128
# motion_deadband_acc = 16
# rescan_s = 2.0   # fallback pad scan; a new pad is detected at once (inotify on /dev/input)
# stick_deadzone = 3
# calibrate_s = 1.0   # gyro calibration at startup - skipped for a pad already calibrated from the receiver window
# calibrate_max_range = 4096
# autobias = true
# autobias_s = 1.0
# autobias_range = 1024
# battery_poll_s = 5.0
# touch_coalesce_ms = 2   # DS4/DSU touch: at most 1 packet per this many ms (0 = every change)
# touch_deadzone = 2   # ignore finger changes smaller than this many units (sensor noise)
# touch_start_move = 5   # mouse: the cursor only starts moving after this much travel (no jitter on a tap)
# gestures = true   # 2 fingers = scrolling, a 2-finger tap = the right mouse button
# rumble = "auto"   # rumble: auto (the evdev driver and a HID report over hidraw at once) | evdev | hidraw | off
# haptics_buffer_ms = 20   # HD haptics from the game (Bluetooth pad): jitter buffer before the pad [ms], 10-200; more = fewer dropouts, more delay
# speaker_buffer_ms = 30   # the pad's speaker (Bluetooth pad, needs libopus): jitter buffer before the pad [ms], 20-200; more = fewer dropouts, more delay
# speaker_volume = 100   # the pad's speaker volume, 0-255
# speaker_opus_bytes = 80   # Opus bytes per 10 ms frame, 30-200 (80 = 64 kbit/s); more = better sound, more Bluetooth traffic
# speaker_opus_mode = "hybrid"   # Opus mode: hybrid (clean voice on the pad) | celt (the old mode: a level dip at every frame edge, a robotic voice)
# speaker_opus_complexity = -1   # Opus encoder effort 0-10: lower = less CPU on the phone; -1 = automatic (3 for hybrid, 5 for celt)
# haptics_motors = "haptics"   # a game's motor rumble while haptics play: haptics (haptics win, the motors wait) | rumble (rumble wins, haptics pause)
# idle_off_min = 15   # switch the pad off (disconnect Bluetooth) after this many idle minutes; 0 = never
# rt_priority = 10   # SCHED_FIFO with this priority (1-99); 0 = the normal scheduler; needs doas
# low_latency = true   # no deep CPU sleep + the fastest cores (sender_rt); needs doas
# cpu_latency_us = 50   # low_latency: the longest CPU wake-up time [µs] (deep states sleep for up to ~6.5 ms)
# key = ""   # a shared HMAC key (the same in the receiver); without it anyone on the LAN can send commands.
#   Generate one: python3 -c "import secrets; print(secrets.token_urlsafe(24))". The service: doas ./install-service.sh
#   moves --key to /etc/dualsense-sender.env (not visible in ps)
# stats = false
